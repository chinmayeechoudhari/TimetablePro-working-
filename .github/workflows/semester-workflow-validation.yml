name: Semester workflow validation

on:
  push:
    branches:
      - feature/date-aware-semester-solver
  pull_request:
    branches:
      - feature/date-aware-semester-solver

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run date-aware scheduling tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test-semester-workflow.db
        run: |
          pytest -q app/solver/test_semester_solver.py tests/test_semester_optimize_api.py tests/test_semester_api.py tests/test_semester_constraint_compiler.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
